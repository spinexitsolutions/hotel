# Local production-like stack: docker compose up --build
services:
  db:
    # Prisma needs MongoDB to run as a replica set (for transactions); a single-node set is enough.
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongodata:/data/db]
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it has a primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'db:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      retries: 20
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: mongodb://db:27017/hotel?replicaSet=rs0
      APP_URL: http://localhost:4000
      API_URL: http://localhost:4000
      SESSION_SECRET: ${SESSION_SECRET:-local-compose-session-secret-please-change-0123}
      PAYMENT_PROVIDER: sandbox
      SANDBOX_PAYMENT_SECRET: ${SANDBOX_PAYMENT_SECRET:-local-compose-sandbox-secret-0123456}
      EMAIL_PROVIDER: log
      TRUST_PROXY: 0
    volumes: [uploads:/app/server/uploads]
volumes:
  mongodata:
  uploads:
