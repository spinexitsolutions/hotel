# Local production-like stack: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgresql://hotel:hotel@db:5432/hotel?schema=public
      APP_URL: http://localhost:4000
      API_URL: http://localhost:4000
      SESSION_SECRET: ${SESSION_SECRET:-local-compose-session-secret-please-change-0123}
      PAYMENT_PROVIDER: sandbox
      SANDBOX_PAYMENT_SECRET: ${SANDBOX_PAYMENT_SECRET:-local-compose-sandbox-secret-0123456}
      EMAIL_PROVIDER: log
      TRUST_PROXY: 0
    volumes: [uploads:/app/server/uploads]
volumes:
  pgdata:
  uploads:
