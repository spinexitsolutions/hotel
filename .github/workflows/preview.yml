# Builds the site with demo data and commits screenshots to preview/ on this branch (preview only; not for main).
name: Preview screenshots
on:
  push:
    branches: [claude/beautiful-heisenberg-6md6ar]
    paths-ignore: ['preview/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mongodb://localhost:27017/hotel_preview?replicaSet=rs0&directConnection=true
      SESSION_SECRET: preview-session-secret-0123456789abcdef
      SERVE_WEB: 'true'
      PORT: '4100'
      APP_URL: http://localhost:4100
      API_URL: http://localhost:4100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 30); do [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 2; done
      - run: npm ci
      - run: npm run build
      - name: Seed and start the site
        working-directory: server
        run: |
          npm run db:deploy
          npm run db:seed
          node dist/index.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4100/api/health > /dev/null && break; sleep 1; done
      - name: Screenshots
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null && npm i --no-save playwright@1.48.2 > /dev/null
          npx --prefix /tmp/pw playwright install --with-deps chromium > /dev/null
          cd "$GITHUB_WORKSPACE" && rm -rf preview && NODE_PATH=/tmp/pw/node_modules node .github/preview/screenshots.cjs preview
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          git commit -m "Preview screenshots [skip ci]" && git push || echo "nothing to commit"
      - if: failure()
        run: cat /tmp/server.log || true
