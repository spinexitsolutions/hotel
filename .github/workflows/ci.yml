name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: mongodb://localhost:27017/hotel_test?replicaSet=rs0&directConnection=true
      DATABASE_URL: mongodb://localhost:27017/hotel_test?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Prisma needs a replica set (transactions); a single-node one is enough.
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 30); do [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 2; done
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Smoke test: load the demo data into a fresh database, start the built site and check the main pages.
      - name: Seed demo data and smoke-test the built site
        env:
          DATABASE_URL: mongodb://localhost:27017/hotel_smoke?replicaSet=rs0&directConnection=true
          SESSION_SECRET: ci-smoke-session-secret-0123456789abcdef
          SERVE_WEB: 'true'
          PORT: '4100'
        working-directory: server
        run: |
          npm run db:deploy
          npm run db:seed
          node dist/index.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4100/api/health > /dev/null && break; sleep 1; done
          set -x
          curl -sf http://localhost:4100/api/health
          curl -sf http://localhost:4100/api/site | grep -q 'Rambagh Palace'
          curl -sf http://localhost:4100/api/pages/home | grep -q 'The jewel of Jaipur'
          test "$(curl -sf http://localhost:4100/api/rooms | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log((j.items??j.rooms??j).length)})")" = 5
          for path in / /rooms /rooms/royal-suite /dining /about /book /admin; do curl -sf "http://localhost:4100$path" | grep -q '<div id="root">'; done
      - name: Server log
        if: failure()
        run: cat /tmp/server.log || true
