name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: mongodb://localhost:27017/hotel_test?replicaSet=rs0&directConnection=true
      DATABASE_URL: mongodb://localhost:27017/hotel_test?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Prisma needs a replica set (transactions); a single-node one is enough.
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 30); do [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 2; done
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
