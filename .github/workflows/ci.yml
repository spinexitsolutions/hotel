name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hotel, POSTGRES_PASSWORD: hotel, POSTGRES_DB: hotel_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hotel" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hotel:hotel@localhost:5432/hotel_test?schema=public
      DATABASE_URL: postgresql://hotel:hotel@localhost:5432/hotel_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
